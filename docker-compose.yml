version: "3.9"
services:
  clockwork:
    build: .
    ports:
      - "100.64.0.10:3000:3000"
    volumes:
      - clockwork-db:/data/db
      - clockwork-repos:/data/repos
      - clockwork-transcripts:/data/transcripts
      - clockwork-artifacts:/data/artifacts
      - ./memory:/data/memory
    environment:
      - NODE_ENV=production
      - CLOCKWORK_DB_PATH=/data/db/clockwork.sqlite
      - CLOCKWORK_REPOS=/data/repos
      - CLOCKWORK_TRANSCRIPTS=/data/transcripts
      - CLOCKWORK_ARTIFACTS=/data/artifacts
      - CLOCKWORK_TOKEN=${CLOCKWORK_TOKEN}
      - CLOCKWORK_NOTIFY_URL=${CLOCKWORK_NOTIFY_URL}
      - CLOCKWORK_NOTIFY_TOKEN=${CLOCKWORK_NOTIFY_TOKEN}
      - CLOCKWORK_GIT_TOKEN=${CLOCKWORK_GIT_TOKEN}
      - PI_MODEL=${PI_MODEL:-frame-low}
    restart: unless-stopped
    networks:
      - tailnet

volumes:
  clockwork-db:
  clockwork-repos:
  clockwork-transcripts:
  clockwork-artifacts:

networks:
  tailnet:
    driver: bridge
